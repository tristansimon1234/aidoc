<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Don't leak the full URL (which on /invite/:token carries the
         invitee's email as a query param) to third-party hosts via the
         Referer header. Same-origin requests still get the full URL. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" href="https://xpcacqvwnfdkvmqbeeqp.supabase.co/storage/v1/object/public/website/playd-appicon-purple.png" />
    <link rel="apple-touch-icon" href="https://xpcacqvwnfdkvmqbeeqp.supabase.co/storage/v1/object/public/website/playd-appicon-purple.png" />
    <title>doclee</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
    <!-- Doclee's own widget is injected only inside the admin Shell
         (see Shell.tsx) so it doesn't double up the public-docs page,
         which already has its own chat launcher. -->
  </body>
</html>
